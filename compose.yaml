# Letter by Letter, production.
#
# Caddy joins letter-by-letter_default and proxies to letter-by-letter:4000;
# no host port is published. State lives in memory only, so the container is
# read-only and stateless. For a side-by-side candidate use a separate project
# name (-p) plus LETTER_IMAGE / LETTER_CONTAINER_NAME overrides.
services:
    letter-by-letter:
        container_name: "${LETTER_CONTAINER_NAME:-letter-by-letter}"
        image: "${LETTER_IMAGE:-letter-by-letter:local}"
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            NODE_ENV: production
            PORT: "4000"
            # Only Caddy can reach this container, so its X-Forwarded-For is
            # the real client address (used for per-address limits).
            TRUST_PROXY: "1"
        restart: unless-stopped
        init: true
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: "5m"
                max-file: "2"
