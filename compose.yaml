# Letter by Letter - production compose definition.
#
# Deliberately no `deploy.resources` / `mem_limit`: this service is tiny
# (single Node process, in-memory rooms) and must not be throttled by a tight
# memory cap that could OOM-kill mid-round.
#
# Caddy joins letter-by-letter_default and proxies to letter-by-letter:4000.
# Production publishes no host port. For an isolated candidate, use a separate
# compose project (-p) and a temporary override binding a candidate-only port.
# LETTER_IMAGE and LETTER_CONTAINER_NAME remain available for candidates.
services:
    letter-by-letter:
        container_name: "${LETTER_CONTAINER_NAME:-letter-by-letter}"
        image: "${LETTER_IMAGE:-letter-by-letter:local}"
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            NODE_ENV: production
            PORT: "4000"
        restart: unless-stopped
        init: true
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: "5m"
                max-file: "2"
